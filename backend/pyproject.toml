[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longbox-backend"
version = "2.0.0"
description = "longbox FastAPI sidecar — local comics library, index and (later) scraper"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pillow>=10",
    "python-multipart>=0.0.9",
    "py7zr>=0.21",   # 7z → zip conversion at ingest (vault stores only zip)
    "rarfile>=4.1",  # rar → zip conversion (needs an unrar/bsdtar backend at runtime)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6.10",  # freezes the sidecar for packaged builds
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
